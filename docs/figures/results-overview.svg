<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">PyTutor retrieval baselines and local AST diagnosis</title>
<desc id="figDesc">Left: Hit@5, Recall@5 and MRR for TF-IDF, vector and hybrid retrieval on thirty answerable queries. Vector and hybrid both reach Hit@5 0.933, Recall@5 0.501 and MRR 0.890; TF-IDF reaches 0.900, 0.407 and 0.900. Right: AST diagnosis matches 47 of 47 misconception cases with no false positives on 22 clean cases. AST figures are same-set results, not a held-out estimate.</desc>
